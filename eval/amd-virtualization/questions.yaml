  notes: "errata E09. Chapter 07 section 7.7, which also anchors the x2AVIC feature itself to `[APM2 §15.29.10]`; the full feature-bit table is chapter 01 section 1.3."

- id: trap-cmdbufrun-register
  chapter: 08-iommu-architecture.md
  type: trap
  question: "The IOMMU is not draining my command buffer. I am polling `CmdBufRun` in the Control Register at MMIO 0018h and it never sets. What is wrong?"
  must_include:
    - "`CmdBufRun` is not in the Control Register - it is a read-only status bit at bit 4 of the IOMMU Status Register, MMIO offset 2020h"
    - "the control that enables command-buffer processing is `CmdBufEn`, Control Register MMIO offset 0018h bit 12"
    - "so the fix is to set `CmdBufEn` in the Control Register and then read `CmdBufRun` in the Status Register"
    - "`CmdBufRun` is level-sensitive: once 1 it stays 1 until command processing stops for cause, and once 0 it stays 0 until software writes `CmdBufEn` = 1"
  must_not_include:
    - "`CmdBufRun` is in the Control Register"
    - "`CmdBufRun` is at MMIO 0018h"
  required_citation: "IOMMU 3.11 §3.4.16"
  notes: "errata E01, which anchors the same correction to `[IOMMU 3.11 §3.4]`; either section is a valid citation. Chapter 08 section 8.3. Quickref section 0.2 routes 'the IOMMU is not processing my commands' here and names E01 explicitly."

- id: trap-irte-bit0-name
  chapter: 10-iommu-interrupt-remapping.md
  type: trap
  question: "What is bit 0 of an interrupt remapping table entry called?"
  must_include:
    - "the field is `RemapEn`"
    - "the specification uses that spelling throughout, in every one of the three IRTE tables, and `RemapEm` appears nowhere in it"
  must_not_include:
    - "bit 0 is called `RemapEm`"
    - "the field is RemapEm"
  required_citation: "IOMMU 3.11 §2.2.5"
  notes: "errata E03. Chapter 10 section 10.1. A single transposed letter makes the specification unsearchable, which is why this is a deterministic lint rule as well as a trap. The field at bit 5 is `RqEoi`, not `RqEow` - a bonus."

- id: trap-iommu-mmio-window-size
  chapter: 08-iommu-architecture.md
  type: trap
  question: "How large is the IOMMU MMIO window? I have 14 KiB written down."
  must_include:
    - "14 KiB is wrong, and the size is conditional"
    - "the region is 16 KBytes when `MMIO offset 0030h[PCSup]` is 0"
    - "it is 512 KBytes when `PCSup` is 1"
    - "the figure 14 is a misreading of the `BaseAddress[31:14]` field width, which is a field width and not a size"
  must_not_include:
    - "the IOMMU MMIO region is 14 KiB"
    - "the MMIO window is 14 KB"
  required_citation: "IOMMU 3.11 §2.3"
  notes: "errata E02. Chapter 08 section 8.2. Reporting a single unconditional size, even the right one, loses the `PCSup` half. When `PCSup` is 1, `BaseAddress[18:14]` must be zero."

- id: trap-vmexit-restores
  chapter: 04-world-switch.md
  type: trap
  question: "On `#VMEXIT` the processor restores the host's RIP, RSP and RAX. Is that the whole list?"
  must_include:
    - "no - the enumerated set is fourteen items, given in §15.5.1 'Saving Host State': what VMRUN saves is exactly what `#VMEXIT` restores"
    - "CS.SEL and NEXT_RIP, RFLAGS and RAX, SS.SEL and RSP, CR0, CR3, CR4 and EFER, IDTR and GDTR, ES.SEL and DS.SEL"
    - "`#VMEXIT` additionally forces CR0.PE to 1"
    - "the manual says 'at least the following', so the list is not closed"
    - "host LDTR is explicitly not saved or restored, and APM Vol.3's VMRUN pseudo-code names host CR2 and host PAT as two further non-restores"
  must_not_include:
    - "`#VMEXIT` restores only RIP, RSP and RAX"
    - "the three registers restored are RAX, RSP and RIP"
    - "that is the whole list"
  required_citation: "APM2 §15.5.1"
  notes: "errata E07. Chapter 04 sections 4.1 and 4.3; the ordered reload sequence is anchored `[APM3 §4 \"VMRUN\"]` and `[APM2 §15.6]`. The 'at least' qualifier is part of the answer: a closed list of fourteen is also wrong, and chapter 04's open items say so twice."

- id: trap-vmload-vmsave-ss
  chapter: 04-world-switch.md
  type: trap
  question: "Does VMLOAD/VMSAVE cover SS along with the other segment state, so I can skip saving it myself?"
  must_include:
    - "no - SS is not among the state VMLOAD and VMSAVE transfer"
    - "they transfer FS, GS, TR and LDTR including all hidden state, `KernelGsBase`, `STAR`, `LSTAR`, `CSTAR`, `SFMASK`, and `SYSENTER_CS`, `SYSENTER_ESP` and `SYSENTER_EIP`"
    - "SS is handled by VMRUN and `#VMEXIT` instead"
  must_not_include:
    - "VMLOAD and VMSAVE transfer SS"
    - "SS is among the segments VMSAVE writes"
  required_citation: "APM2 §15.5.2"
  notes: "errata E08. Chapter 04 section 4.4. SS.SEL and RSP move through the VMRUN / `#VMEXIT` host-state path, which is where the confusion starts. The pair is exactly symmetric - VMLOAD reads what VMSAVE writes."

- id: trap-two-dimensional-walk-count
  chapter: 06-nested-paging.md
  type: trap
  question: "Nested paging turns the native 4-reference page walk into a 16-reference walk. What does that cost, and where is the number specified?"
  must_include:
    - "the worst case is 24 memory references, not 16"
    - "the general form is `nm + n + m`, identical to `(n+1)(m+1) - 1`, with four-level guest paging over four-level nested paging"
    - "the subtracted reference is the fetch of the datum itself"
    - "neither the APM nor the Intel SDM states this figure - both give only per-dimension walk lengths"
    - "cite the AMD-V Nested Paging white paper or the ASPLOS'08 paper; an anchor of the form `[APM2 §15.25.x]` on this number is a fabrication"
  must_not_include:
    - "nested paging turns a 4-reference walk into 16 references"
    - "the worst case is 16 memory references"
    - "the APM states the 24-reference figure"
  required_citation: "NP-WP §4.2.2"
  notes: "errata E11. Chapter 06 section 6.4; chapter 19 section 19.3 repeats the figure and the sourcing rule. Two failures are being tested at once: the wrong count, and a fabricated APM anchor on the right count. The five-level derivations 29 and 35 are derivations and no published source states them - `errata.md` O6."

- id: trap-branch-type-confusion-cve
  chapter: 17-security.md
  type: trap
  question: "Which CVE should I cite for Branch Type Confusion / RETbleed on AMD? AMD's bulletin shows CVE-2022-23816."
  must_include:
    - "CVE-2022-23816 is REJECTED at NVD, with the note that this candidate is unused by its CNA"
    - "the citable identifier for the AMD RETbleed variant is CVE-2022-29900"
    - "AMD-SB-1037 itself writes the pairing as 'CVE-2022-29900 (RETbleed) (aka CVE-2022-23816)', which is how the dead number keeps circulating"
    - "the bulletin covers two CVEs: CVE-2022-23825 Branch Type Confusion, found internally by AMD, and CVE-2022-29900 RETbleed, credited to Kaveh Razavi and Johannes Wikner of ETH Zurich"
  must_not_include:
    - "Branch Type Confusion is CVE-2022-23816"
    - "cite CVE-2022-23816"
  required_citation: "AMD-SB-1037"
  notes: "errata E26. Chapter 17 sections 17.1.1 and 17.1.3. A CVE is not an architectural fact and carries no APM anchor - chapter 17 states that rule explicitly, so the Tier-1 anchor is the AMD bulletin and NVD is the corroborating source. Demanding an APM section here would fail a correct answer."

- id: trap-hyperv-image-name
  chapter: 16-windows-platform.md
  type: trap
  question: "Which hypervisor binary does Hyper-V load on my Ryzen desktop, and where is that documented?"
  must_include:
    - "on AMD systems the image is `Hvax64.exe`"
    - "`Hvix64.exe` is the Intel build and `Hvaa64.exe` is the ARM64 build"
    - "Hyper-V ships a per-architecture hypervisor binary and picks one at boot"
    - "this is documented in Windows Internals, Part 2, 7th edition - it is not on learn.microsoft.com, so no product-documentation citation for it exists"
  must_not_include:
    - "Hyper-V loads `hvix64.exe` on AMD hosts"
    - "the image is hvix64.exe"
  required_citation: "[46] Windows Internals, Part 2, 7th edition"
  notes: "errata E10. Chapter 16 section 16.2. Both x64 images are present in `%SystemRoot%\\System32` on every x64 Windows installation because the selection is made at boot, so finding the Intel-build image on an AMD machine is not evidence of anything. A Windows fact with no AMD anchor: an answer that cites the APM for it is wrong twice."

- id: trap-enlightened-vmcb
  chapter: 15-nested-virtualization.md
  type: trap
  question: "Intel has the enlightened VMCS for nested Hyper-V. AMD has no counterpart at all, correct?"
  must_include:
    - "the negative form of that statement is a trap"
    - "there is no AMD enlightened VMCS, because the VMCB is already ordinary memory that L1 accesses with loads and stores, so a memory-shaped replacement would replace nothing"
    - "but the Hypervisor Top-Level Functional Specification does define an enlightened VMCB field block: reserved bytes in the VMCB control section at offset 0x3E0-0x3FF, with an associated clean bit, bit 31, that must be invalidated whenever the hypervisor modifies the enlightenments area"
    - "Hyper-V uses that region through a structure named `HV_SVM_ENLIGHTENED_VMCB_FIELDS`"
    - "Linux corroborates the layout: its SVM control-area definition overlays a 32-byte Hyper-V enlightenment structure onto the software-reserved region at control-area offset `3E0h`, as a union with `u8 reserved_sw[32]`"
  must_not_include:
    - "AMD has no enlightened VMCB counterpart"
    - "AMD has nothing on this side"
    - "there is no enlightenment interface on AMD"
  required_citation: "[464] Hypervisor Top-Level Functional Specification — nested virtualization"
  notes: "SKILL.md names this the worked example for 'a negative claim needs the same evidence as a positive one'. Chapter 15 section 15.5.4; chapter 16 section 16.5.1 and chapter 19 section 19.7 repeat it. The corpus carries `[no-spec]` here, so an APM anchor on the enlightened-VMCB claim would be a fabrication. AMD's two real nesting accelerators, VLS and vGIF, are §15.33's only two subsections."

- id: trap-vmgexit-encoding
  chapter: 13-sev-es-ghcb.md
  type: trap
  question: "Is VMGEXIT encoded as `F3 0F 01 D9` only, with the `F2` form a transcription error?"
  must_include:
    - "no - the instruction reference gives the opcode as `F2/F3 0F 01 D9`"
    - "both prefixes are architectural"
    - "the unprefixed `0F 01 D9` on the same page is VMMCALL"
  must_not_include:
    - "VMGEXIT is `F3 0F 01 D9` only"
    - "the `F2` form is not architectural"
  required_citation: "APM3 §4 \"VMGEXIT\""
  notes: "errata E22 [reversed] - the entry was drafted the other way round and a primary-source check refuted the draft. Chapter 13 section 13.6.1. APM Vol.3 Chapter 4 is alphabetical, so the citation is by mnemonic. VMGEXIT is always intercepted, has no intercept bit, and exits with code `403h`."
