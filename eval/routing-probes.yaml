# Routing probes — new in v2
#
# The vendor and dev question sets measure CONTENT RECALL: given that the right
# chapter was read, is the answer right? They all run in one host, so they
# cannot see the failure the v2 rebuild was actually started for — an agent
# that never loaded the skill, or loaded it and opened the wrong chapter.
#
# A probe scores three things, all observable from the agent's tool calls:
#
#   triggered   did the skill activate at all
#   routed      did it open the expected chapter
#   tiered      did it stop at a section, or read the whole chapter
#
# The third exists because reading a whole chapter where a section would do is
# the defect the tiered contract was written to fix: a TDX question costs about
# 26,000 tokens read whole and about 1,400 read properly. It is scored as a
# PARTIAL failure, not a pass. See eval/RUNNER.md.
#
# Run this set ONCE PER TARGET HOST. It cannot run in CI: it needs several
# hosts and it needs the agent's tool calls to be observable.
#
# Targets as of 2026-09-26: Claude Code, OpenAI Codex, Kimi Code CLI.
#
# Note on `vendor_named`. A probe marked `no` contains none of the words
# "Intel", "AMD", or a vendor-specific instruction or register. Under the old
# two-skill layout these were the questions with no answer: both skills claimed
# them, both shared the trigger token, and the tie-break rule lived in a file
# neither host loaded. They are the reason the skills were merged, so they are
# the probes that matter most. If any of them fails to route, the merge did not
# achieve what it was for.

probes:

