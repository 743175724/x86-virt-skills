- id: vmlaunch-error-7
  chapter: 04-vm-entry.md
  type: diagnosis
  question: "My hypervisor worked on my old test box and now VMLAUNCH sets ZF with VM-instruction error 7 on a newer machine. What is wrong?"
  must_include:
    - "error 7 is 'VM entry with invalid control field(s)' - the failure is in the VMX controls, not the instruction"
    - "the error number does not say which control was wrong"
    - "the usual cause of 'worked on one machine and not another' is a control bit hard-coded rather than derived from the capability MSRs"
    - "re-derive every control field from its capability MSR: OR in the allowed-0 half, AND with the allowed-1 half, and prefer the TRUE_ MSR when IA32_VMX_BASIC bit 55 is 1"
    - "the other common cause is a dependency check after enabling a new feature - unrestricted guest without EPT, virtual-interrupt delivery without external-interrupt exiting, posted interrupts without acknowledge-interrupt-on-exit"
    - "control-field failures leave the guest untouched: control returns to the instruction after VMLAUNCH"
  required_citation: "SDM 3C §27.9.5"
  notes: "Chapter 04 sections 4.3, 4.10 and the failure-signature table in 4.11; error list in 08 section 8.4."

- id: vmresume-error-5-after-migration
  chapter: 04-vm-entry.md
  type: diagnosis
  question: "I move a vCPU to another logical processor and the first VMRESUME there fails with error 5. The VMCS is definitely the right one."
  must_include:
    - "error 5 is 'VMRESUME with non-launched VMCS'"
    - "the VMCLEAR you executed on the old processor reset the launch state to clear"
    - "the next entry on the new processor must be VMLAUNCH, not VMRESUME"
    - "the launch state lives in the VMCS and no instruction reads it back, so software has to track it - reset your own launched flag whenever you VMCLEAR"
    - "VMCLEAR before moving the VMCS is still mandatory, because it flushes VMCS data the old processor may hold in implementation-specific caches"
  required_citation: "SDM 3C §27.9.5"
  notes: "Chapter 04 sections 4.2 and 4.11; the state machine is chapter 02 section 2.4.1 where the hazard is two lines of code."

- id: vmlaunch-cf-no-error
  chapter: 04-vm-entry.md
  type: diagnosis
  question: "After VMLAUNCH, RFLAGS.CF is set and the VM-instruction error field is empty. Where do I even start?"
  must_include:
    - "CF set with ZF clear is VMfailInvalid, which means there is no valid current VMCS in which to record an error number"
    - "so VMPTRLD was never executed, or a VMCLEAR of that VMCS cleared the current-VMCS pointer"
    - "test CF first and ZF second after every VMX instruction: CF means the VMCS pointer or operand was structurally unusable, ZF means the VMCS was found and its contents rejected"
    - "reading the VM-instruction error field is pointless when CF is set"
  required_citation: "SDM 3C Ch.33"
  notes: "Chapter 04 sections 4.9 and 4.11 row 1; chapter 08 section 8.1 states the flag protocol."

- id: vmlaunch-error-8-64bit
  chapter: 04-vm-entry.md
  type: diagnosis
  question: "A brand new 64-bit hypervisor fails its very first VMLAUNCH with error 8, before any guest code runs."
  must_include:
    - "error 8 is 'VM entry with invalid host-state field(s)'"
    - "the classic cause on a 64-bit VMM is the host address-space size VM-exit control left at 0"
    - "the other common cause is a host segment selector with a non-zero RPL or TI - host CS, SS, DS, ES, FS, GS and TR selectors must have selector bits 2:0 equal to 000b"
    - "if the logical processor is in IA-32e mode when VM entry executes, the host address-space size control must be 1"
    - "with host address-space size 1, host CR4.PAE must be 1 and host RIP must be canonical"
    - "a host-state failure leaves the guest untouched and returns to the instruction after VMLAUNCH, which is how you tell it apart from a guest-state failure"
  required_citation: "SDM 3C §27.5"
  notes: "Chapter 04 section 4.4 and the practical-consequence note after it, plus the 4.11 signature table."

- id: entry-failure-33-qualification-0
  chapter: 04-vm-entry.md
  type: diagnosis
  question: "My first VM entry appears to succeed and then I land at my host RIP with exit reason 8000_0021H and exit qualification 0. What failed?"
  must_include:
    - "this is basic exit reason 33, VM-entry failure due to invalid guest state, with the VM-entry-failure bit (bit 31) set"
    - "guest state has already been loaded and then host state was reloaded, so your registers are the host-state area's context, not the context that executed VMLAUNCH"
    - "qualification 0 means one of the ordinary guest-state checks failed rather than one of the enumerated special cases, so the VMM must re-derive the cause itself"
    - "the two dominant causes during bring-up are the segment access-rights checks and the IA-32e mode consistency set"
    - "the IA-32e consistency set is the VM-entry control 'IA-32e mode guest', guest IA32_EFER.LMA and LME, guest CR0.PG, guest CR4.PAE and the CS access-rights L bit"
    - "qualifications 2, 3 and 4 would instead mean PDPTE loading, NMI injection blocked by STI, and an invalid VMCS-link pointer"
  required_citation: "SDM 3C Ch.29"
  notes: "Chapter 04 sections 4.5.2, 4.5.7, 4.9, 4.10 step 4 and 4.11."

- id: entry-failure-34-msr-load
  chapter: 04-vm-entry.md
  type: diagnosis
  question: "Exit reason 8000_0022H with exit qualification 3. What is the failing thing and where is it?"
  must_include:
    - "this is basic exit reason 34, VM-entry failure due to MSR loading"
    - "the exit qualification is the 1-based index of the failing entry in the VM-entry MSR-load list"
    - "so the offending entry is at msr_load_area + 16 * (qualification - 1), here the third entry"
    - "each entry is 16 bytes: MSR index in bits 31:0, bits 63:32 reserved and must be 0, value in bits 127:64"
    - "an entry fails if bits 63:32 are non-zero, if the index is IA32_FS_BASE (C0000100H), IA32_GS_BASE (C0000101H), IA32_BIOS_UPDT_TRIG (00000079H) or in the x2APIC range 00000800H to 000008FFH, or if a WRMSR with that index and value would fault"
    - "MSRs the VM-entry and VM-exit controls load directly (IA32_EFER, IA32_PAT, IA32_PERF_GLOBAL_CTRL, IA32_BNDCFGS, IA32_DEBUGCTL) should not also be in the MSR areas"
  required_citation: "SDM 3C Ch.29"
  notes: "Chapter 04 sections 4.7, 4.7.1 and 4.10 step 3."

- id: vmxon-general-protection
  chapter: 01-vmx-intro.md
  type: diagnosis
  question: "VMXON takes a #GP(0) on some of our machines and works on others. Firmware shows VT-x as enabled on all of them."
  must_include:
    - "check IA32_FEATURE_CONTROL at MSR 3AH first"
    - "bit 0 is the lock bit; while it is 0, VMXON causes #GP, and once it is 1 any WRMSR to the MSR causes #GP until the next power-up reset"
    - "bit 1 enables VMXON in SMX operation and bit 2 enables VMXON outside SMX operation; VMXON checks the bit matching the current SMX state"
    - "if bit 0 is set and bit 2 is clear, VMX has been disabled by firmware and there is no software path to change it before the next power cycle - report it rather than retry"
    - "the other #GP causes are CPL greater than 0, and CR0 or CR4 holding values outside the window the IA32_VMX_CR0_FIXED0/1 and IA32_VMX_CR4_FIXED0/1 MSRs allow"
    - "a missing CR4.VMXE gives #UD, not #GP"
  required_citation: "SDM 3C Ch.26"
  notes: "Chapter 01 sections 1.4, 1.5 and the diagnosis table in 1.8.1. Quickref section 0.2 routes 'VMXON fails' here."

- id: lost-event-during-delivery
  chapter: 05-vm-exit.md
  type: diagnosis
  question: "My guest occasionally hangs after a page fault that happened while it was already delivering an interrupt. Exits look normal otherwise."
  must_include:
    - "you are losing the event that was in delivery: read the IDT-vectoring information field on every VM exit, unconditionally"
    - "when its valid bit (bit 31) is set, an event was interrupted during delivery through the guest IDT and must be re-injected"
    - "copy the IDT-vectoring information and its error code into the VM-entry interruption-information and VM-entry exception error-code fields for the next entry"
    - "for a software interrupt or software exception, carry the VM-exit instruction length over to the VM-entry instruction length"
    - "the field can be valid for many different basic exit reasons - a task switch, an EPT violation or an exception can all interrupt event delivery"
  required_citation: "SDM 3C §30.2.4"
  notes: "Chapter 05 sections 5.6 and 5.12 step 3 call this 'the classic source of the guest hangs after a nested fault'."

- id: apicv-interrupts-lost-when-descheduled
  chapter: 07-apic-virtualization.md
  type: diagnosis
  question: "Interrupts go missing for a vCPU that my scheduler has just blocked, but only under APICv with posted interrupts."
  must_include:
    - "a blocked vCPU must not simply be left with its posted-interrupt descriptor pointing at it: repoint NV at a host wake-up vector and NDST at the host CPU so a posting wakes the vCPU through the host interrupt path"
    - "the VMM must also refuse to block if ON is already set, because a notification is already in flight"
    - "SN is the control for a vCPU that is descheduled or executing in host context: a poster then records the vector in PIR and sends no notification, and the interrupts accumulate for the next merge"
    - "VM entry performs posted-interrupt processing when ON is set, so interrupts posted while the vCPU was not running are picked up at the next entry rather than lost"
  required_citation: "SDM 3C Ch.32"
  notes: "Chapter 07 section 7.8.4. Quickref section 0.2 routes 'guest loses or duplicates interrupts under APICv' to 07 sections 7.6 and 7.8."

- id: msix-not-delivered-after-remapping
  chapter: 11-vtd-interrupt-remapping.md
  type: diagnosis
  question: "MSI-X stopped being delivered as soon as I enabled interrupt remapping. Some devices work, the ones with large index values do not."
  must_include:
    - "the top bit of the handle is not adjacent to the others: Handle[14:0] is in address bits 19:5 and Handle[15] is at address bit 2"
    - "software that builds the MSI address by shifting a 16-bit handle left by 5 silently loses the top bit for handles at or above 0x8000"
    - "check IRTA_REG.S as well: entries = 2^(S+1), so S is a log2-minus-one"
    - "nothing in IRTA_REG takes effect until GCMD_REG.SIRTP (bit 24) is set and GSTS_REG.IRTPS (bit 24) reports it serviced"
    - "the enable order is: program IRTA_REG, set SIRTP and wait for IRTPS, invalidate the interrupt entry cache with a global iec_inv_dsc, then set GCMD_REG.IRE (bit 25) and wait for GSTS_REG.IRES"
    - "an index at or beyond the table size faults with reason 21h; a clear Present bit in the IRTE faults with 22h; a source-id verification failure faults with 26h"
  required_citation: "VT-d 5.20 §5.1.5.2"
  notes: "Chapter 11 sections 11.8, 11.10 and the pitfall list in 11.12."

- id: device-dma-faulting
  chapter: 12-vtd-faults-bios-siov.md
  type: diagnosis
  question: "A device's DMA is being blocked after I turned on DMA remapping, and my fault handler never fires."
  must_include:
    - "a non-recoverable fault blocks the request regardless of whether it is reported, so the blocking and the reporting are separate questions"
    - "FECTL_REG.IM (bit 31) defaults to 1, so fault interrupts are masked out of reset - a driver that programs the fault event registers but never clears IM logs faults it never sees"
    - "read the Fault Recording Registers directly: they are at base + 16 * CAP_REG.FRO, the count is CAP_REG.NFR + 1, and FSTS_REG.FRI gives the index to start from"
    - "process them in circular FIFO order from FRI until you find one with F clear, and clear each F by writing 1"
    - "FPD set anywhere in the translation path suppresses reporting of a qualified fault without permitting the request, so an FPD-heavy configuration degrades observability rather than isolation"
    - "if the device is covered by an RMRR, the second-stage structures must provide an identity mapping with read and write permissions for that reserved region or its legacy DMA fails"
  required_citation: "VT-d 5.20 §7.2.1"
  notes: "Chapter 12 sections 12.2, 12.2.2, 12.5.4 and 12.8.1. Quickref section 0.2 routes 'device DMA is blocked or faulting' to 12 sections 12.2 and 12.3."

- id: seamcall-illegal-sequence
  chapter: 13-tdx.md
  type: diagnosis
  question: "My TDX host code gets an error back from a SEAMCALL that the ABI spec says exists. What class of mistake is this usually?"
  must_include:
    - "TDX enforces call ordering through two nested state machines, so the leaf can be valid and still be illegal in the current state"
    - "the outer machine is the TD life cycle: TD_HKID_ASSIGNED, TD_KEYS_CONFIGURED, TD_BLOCKED, TD_TEARDOWN"
    - "the inner machine is TDCS.OP_STATE, whose baseline states are UNALLOCATED, UNINITIALIZED, INITIALIZED and RUNNABLE"
    - "TDH.VP.CREATE, TDH.VP.ADDCX and TDH.VP.INIT are legal only in the INITIALIZED state - VCPU creation is allowed only during TD build time"
    - "at module scope, until the module reaches SYS_READY only the TDH.SYS.* bring-up leaves are accepted"
    - "completion status is in RAX: 0 is success, a positive value is success with a warning, and a negative value is an error, with the class in bits 47:40"
    - "a SEAMCALL can also fail before reaching a leaf at all, with #UD, #GP(0) or VMfailInvalid signalled by RFLAGS.CF = 1, in which case RAX is unmodified"
  required_citation: "TDX-BASE §7.2"
  notes: "Chapter 13 sections 13.7, 13.7.1, 13.7.2 and 13.19. Quickref section 0.2 routes 'SEAMCALL returns an error / illegal sequence' to 13 section 13.7."

- id: vtx-unavailable-on-windows
  chapter: 17-windows-platform.md
  type: diagnosis
  question: "My hypervisor says VT-x is not available on this Windows 11 laptop. Firmware clearly has virtualization enabled and CPUID reports VMX. What is going on?"
  must_include:
    - "the Windows hypervisor already holds VMX root operation, so your VMXON cannot succeed"
    - "the Windows kernel itself is a guest running in VTL0 and the machine is already a hypervisor host"
    - "VBS or memory integrity, WSL2, Windows Sandbox, Docker Desktop's Hyper-V backend or the Hyper-V role will each have started it, even with no virtual machine defined"
    - "the three options are: use the Windows Hypervisor Platform API, run nested inside a child partition, or turn the hypervisor off"
    - "turning it off loses every Hyper-V-backed feature at once, including virtualization-based security"
    - "this is a statement about who owns VMX root operation, not about firmware"
  must_not_include:
    - "re-enable Intel VT-x in the BIOS"
  required_citation: "SDM 3C Ch.26"
  notes: "Chapter 17 sections 17.1, 17.3.6 and 17.9.1 row 1; chapter 14 section 14.12.1. Quickref section 0.5 question 1."

- id: driver-rejected-after-memory-integrity
  chapter: 15-security.md
  type: diagnosis
  question: "Our kernel driver loaded fine for years and now Windows refuses it as soon as memory integrity is turned on. It is signed."
  must_include:
    - "memory integrity (HVCI) enforces W^X on kernel memory from VTL1, so the failure is structural, not a signing policy change"
    - "drivers that allocate memory that is simultaneously writable and executable are incompatible"
    - "so are drivers that generate or patch code at runtime, or mix data and code in one section"
    - "the guidance is a clear separation of data and code, and never modifying code pages directly"
    - "the permission decision lives in the EPT entry the hypervisor controls, not in the VTL0 page tables, so the kernel cannot grant the page execute rights"
    - "unsigned or improperly signed code fails for a second, separate reason: the integrity check that authorises the transition to executable runs in the secure environment"
  required_citation: "SDM 3C §31.3.2"
  notes: "Chapter 15 section 15.8; chapter 17 sections 17.6 and 17.6.1. Quickref section 0.5 question 3."

- id: hypervisor-works-linux-not-windows11
  chapter: 17-windows-platform.md
  type: diagnosis
  question: "My type-2 hypervisor runs fine on Linux and misbehaves or runs much slower on the same machine under Windows 11. What changed?"
  must_include:
    - "on Linux the vendor module executes VMXON itself, so the host is in VMX root operation and your VMM owns the hardware"
    - "on a Windows machine with any Hyper-V-backed feature enabled the Windows hypervisor owns VMX root operation, and your VMM becomes a user-mode process whose guest is a Hyper-V partition reached through the Windows Hypervisor Platform"
    - "every guest exit is then handled twice: the hardware exits to the Windows hypervisor, which decides whether it owns the exit, and only then is an exit context returned to your user-mode code"
    - "you also lose the ability to program your own VM-execution controls - register access is by name through the API and the VMCS is never visible, so an optimisation the API does not expose is unavailable regardless of what the hardware supports"
    - "if the VMM runs inside a Hyper-V child partition instead, the nested exit-multiplication cost applies on top"
    - "this knowledge base records no measurement of the resulting difference carrying processor, workload and configuration - the direction follows from the mechanism, the magnitude does not"
  required_citation: "SDM 3C Ch.26"
  notes: "Chapter 17 sections 17.1, 17.3.1, 17.3.2, 17.3.4 and 17.3.6; chapter 14 section 14.12; chapter 16 section 16.5."

- id: vbs-overhead-figure
  chapter: 16-performance.md
  type: diagnosis
  question: "How many frames per second will I lose if I leave memory integrity on for gaming?"
  must_include:
    - "the published figures disagree and none of them reaches this knowledge base with a complete condition set"
    - "the circulating figures are about 6% average frame-rate loss, a general '5-10%' system figure, and a '5-25%' gaming range"
    - "the 6% figure reached this knowledge base only through secondary reporting and the original benchmark, processor, titles and settings were not read"
    - "the '5-10%' and '5-25%' figures have no traceable primary source here"
    - "these must not be averaged into a single number"
    - "what can be stated is the mechanism: the hypervisor is resident so some operations become exits, second-level address translation is active for the whole machine and not only for VMs, and kernel page-permission changes require a transition to VTL1"
    - "a comparison that toggles memory integrity is not measuring the same thing as one that disables the hypervisor, because the second also removes the second-level translation cost"
  must_not_include:
    - "expect around 10% on average"
  required_citation: "SDM 3C §31.3.2"
  notes: "Chapter 16 sections 16.3.1, 16.3.2, 16.3.3 and 16.11 item 4; chapter 15 section 15.12; errata O4. Producing a single number is the failure being tested."

- id: modern-vmexit-cycles
  chapter: 16-performance.md
  type: diagnosis
  question: "What does a VM exit cost in cycles on a current client CPU?"
  must_include:
    - "this knowledge base holds no public cycle-level VM-exit measurement for Ice Lake, Sapphire Rapids, Granite Rapids or any recent client part"
    - "the newest hard cycle figure available here is the Westmere round trip published in 2010"
    - "the 2010 Intel figures are best-case round trips of about 1100 cycles on Penryn, about 820 on Nehalem and about 650 on Westmere, the last attributed to VMCS caching"
    - "those are bare hardware transitions with no handler; the end-to-end cost of handling an exit is a different quantity, measured in NOVA at about 3900 cycles of which 1016 (26%) was the transition"
    - "do not interpolate from the 2010 figures to a modern part"
  must_not_include:
    - "roughly 500 cycles on a modern core"
  required_citation: "SDM 3C Ch.30"
  notes: "Chapter 16 sections 16.2.3, 16.2.4, 16.2.5 and 16.12 step 3; SKILL.md 'Known limits' states the same absence."

- id: whp-vs-bare-vmx-figure
  chapter: 16-performance.md
  type: diagnosis
  question: "How much slower is my VMM on the Windows Hypervisor Platform than it would be owning VMX directly?"
  must_include:
    - "no public measurement carrying processor, guest workload and configuration is recorded in this knowledge base"
    - "the direction follows from the mechanism, the magnitude does not"
    - "the mechanism is that each exit is processed twice - the hardware exits to the Windows hypervisor, which decides whether it owns the exit, and only then is an exit context returned to the user-mode VMM, one more boundary crossing than a VMM owning VMX root operation pays"
    - "the arrangement also removes the VMM's ability to program its own VM-execution controls, so optimisations that depend on a specific control are unavailable regardless of hardware support"
  required_citation: "SDM 3C Ch.30"
  notes: "Chapter 16 section 16.5 and chapter 17 section 17.3.4. Chapter 16 calls this the cleanest example in the chapter of a mechanism plus an explicit 'no measured figure here'."

- id: wsl2-overhead-figure
  chapter: 16-performance.md
  type: diagnosis
  question: "What does running WSL2 cost me when I am not using it?"
  must_include:
    - "no measurement of WSL2, Windows Sandbox or a Windows container backend carrying processor, workload and configuration is recorded in this knowledge base"
    - "the mechanism can be stated: a utility VM is a Hyper-V partition, it holds memory, its virtual processors are scheduled against the host's, and its I/O crosses a synthetic-device boundary, so the cost is present whenever it is running"
    - "the dominant reported costs for this class are memory residency and cross-boundary filesystem access rather than CPU overhead, because guest compute runs in non-root operation at native speed"
    - "enabling WSL2 also makes the machine a hypervisor host, which has its own consequences for third-party VMMs"
  required_citation: "SDM 3C Ch.31"
  notes: "Chapter 16 section 16.4 and chapter 17 section 17.4.1/17.4.6."

- id: vtl-transition-cost
  chapter: 16-performance.md
  type: diagnosis
  question: "How many cycles does a VTL0 to VTL1 transition take on a Windows machine with VBS on?"
  must_include:
    - "this knowledge base records no measurement of a VTL transition in cycles"
    - "what can be stated is that calls into the secure kernel are VTL transitions, hypervisor-mediated, so they cost at least a round trip of the kind measured for VM exits"
    - "the same absence applies to hypercall cost, VMBus round-trip latency and the Windows Hypervisor Platform exit path"
  must_not_include:
    - "about 1000 cycles"
  required_citation: "SDM 3C Ch.30"
  notes: "Chapter 16 sections 16.3.1 and 16.10.1."

