- id: vm-entry-check-order
  chapter: 04-vm-entry.md
  type: mechanism
  question: "Walk me through what a VM entry actually does, in order, and explain why some failures come back to the instruction after VMLAUNCH and others come back at my host RIP."
  must_include:
    - "stage 1 is basic checks on the instruction and the current VMCS"
    - "stage 2 is the checks on the VMX controls and on the host-state area"
    - "stage 3 is the checks on the guest-state area"
    - "stage 4 loads guest state and clears address-range monitoring"
    - "stage 5 loads MSRs from the VM-entry MSR-load area"
    - "stage 6 sets the launch state to launched for VMLAUNCH, and stage 7 performs event injection"
    - "failure in stage 1 or 2 does not start the entry: control passes to the instruction after VMLAUNCH or VMRESUME with the VMfail flag protocol"
    - "failure in stage 3 or 5 happens after guest state has been loaded, so the processor loads host state and resumes at the host RIP with a VM-entry failure in the exit-reason field"
  required_citation: "SDM 3C Ch.29"
  notes: "Chapter 04 section 4.1. The consequence that VMfail never changes guest-visible state while a 33/34 failure already overwrote it is the point of the question."

- id: pir-virr-merge-and-on-sn-race
  chapter: 07-apic-virtualization.md
  type: mechanism
  question: "Explain the PIR-to-VIRR merge in posted-interrupt processing, and why the order of operations inside it is a correctness argument rather than an implementation detail."
  must_include:
    - "the processor clears ON first"
    - "then acknowledges the notification interrupt at the local APIC"
    - "then performs an atomic read-and-clear of PIR"
    - "ORs the value read into VIRR on the virtual-APIC page"
    - "raises RVI to the highest vector taken from PIR if that is greater than the current RVI"
    - "then evaluates pending virtual interrupts"
    - "clearing ON before the read-and-clear is what makes the protocol lossless: the worst case is a redundant notification, never a dropped vector"
    - "if ON were cleared after PIR was read, a poster landing in between would see ON = 1, skip the notification, and leave its bit in a PIR the target had just emptied - a lost interrupt"
    - "SN suppresses the notification entirely while the target vCPU cannot use it; the interrupts still accumulate in PIR for the next merge"
  required_citation: "SDM 3C Ch.32"
  notes: "Chapter 07 sections 7.8.3 and 7.8.4. An answer that describes the merge but not the ordering argument should lose the last three items."

- id: vmcs-shadowing-mechanism
  chapter: 14-nested-virtualization.md
  type: mechanism
  question: "How does VMCS shadowing actually work, and what stops a guest hypervisor from simply running its guest out of the shadow VMCS?"
  must_include:
    - "a VMCS is a shadow VMCS when bit 31 of the first 4 bytes of the VMCS region is 1; bits 30:0 of the same doubleword are the revision identifier"
    - "VMCS shadowing is enabled by a secondary processor-based VM-execution control"
    - "the shadow VMCS that a guest VMREAD or VMWRITE reaches is the one named by the VMCS-link pointer of the current VMCS"
    - "two 4-KByte bitmaps, the VMREAD bitmap and the VMWRITE bitmap, hold one bit per encoding: 1 causes a VM exit, 0 lets the access complete against the shadow VMCS"
    - "a 4-KByte bitmap holds 32768 bits, so only encodings below 8000H can be shadowed; an operand with any bit set in 63:15 always exits"
    - "VM entry fails if the current VMCS is a shadow VMCS, so a shadow VMCS can be made current for initialisation but can never be entered"
    - "the shadow VMCS hangs off the VMCS-link pointer of vmcs01, the VMCS that runs L1; it is not vmcs02"
  required_citation: "SDM 3C §27.6.15"
  notes: "Chapter 14 section 14.3 owns the nested use; chapter 02 section 2.11 owns the VMCS-side facts. Encodings 0x2026 and 0x2028 for the two bitmaps are a bonus."

- id: vmcs02-merging
  chapter: 14-nested-virtualization.md
  type: mechanism
  question: "When L1 asks to run L2, how does L0 build the VMCS the hardware actually loads, and which parts are unions and which are intersections?"
  must_include:
    - "the host-state area of vmcs02 comes from vmcs01, because an exit from L2 must land in L0"
    - "the guest-state area of vmcs02 comes from vmcs12, with L0 overriding the fields it owns including the VMCS-link pointer"
    - "intercepts are unioned: anything either level wants to trap must trap, because only L0 can catch it"
    - "the exception bitmap of vmcs02 is the union of vmcs01's and vmcs12's"
    - "MSR pass-through is intersected: an MSR may be passed through to L2 only if both vmcs01 and vmcs12 permit it"
    - "pin-based controls are unioned, and L0 keeps its own external-interrupt and NMI exiting regardless of what L1 asked for"
    - "the EPTP in vmcs02 always points at an EPT structure L0 controls (EPT02); L1's EPTP value is data to interpret, never a pointer the hardware loads"
    - "TSC offsets compose additively and TSC multipliers multiplicatively"
  required_citation: "SDM 3C §27.6.2"
  notes: "Chapter 14 section 14.4.2. The page-fault error-code mask/match pair is the one place the union cannot be expressed, so L0 must intercept all #PF and filter in software - bonus."

- id: secure-ept-page-acceptance
  chapter: 13-tdx.md
  type: mechanism
  question: "Why does a TD guest have to accept a page the host just gave it, and what is the exact sequence?"
  must_include:
    - "the VMM extends Secure EPT with TDH.MEM.SEPT.ADD if a new level is needed"
    - "the VMM adds and maps the page with TDH.MEM.PAGE.AUG, which leaves the Secure EPT entry in the PENDING state and does not measure the page"
    - "TDH.MEM.PAGE.AUG does not access the destination page at all"
    - "the guest accepts it with TDG.MEM.PAGE.ACCEPT, which zeroes the content"
    - "acceptance exists to defeat an attack in which the host VMM removes arbitrary pages with TDH.MEM.PAGE.REMOVE and replaces them with zeroed pages"
    - "a guest TD must therefore track its own GPA allocation and must never accept a page it already knows to be TD-owned"
    - "a guest access to a PENDING page results in either a #VE or a TD exit, selected by ATTRIBUTES.SEPT_VE_DISABLE and the flexible-pending-VE controls"
  required_citation: "TDX-BASE §9.10.1"
  notes: "Chapter 13 sections 13.8.3 and 13.8.4."

- id: vtd-queued-invalidation
  chapter: 10-vtd-dma-remapping.md
  type: mechanism
  question: "How does queued invalidation work in VT-d, and what ordering do I have to respect between descriptors?"
  must_include:
    - "queued invalidation is supported only where ECAP_REG.QI is set, enabled through GCMD_REG.QIE and observed through GSTS_REG.QIES"
    - "the queue is located by IQA_REG at 090h, with IQH_REG at 080h giving the offset hardware reads next and IQT_REG at 088h the offset software writes next"
    - "it is the only route to PASID-granular and device-TLB invalidation"
    - "hardware completes an IOTLB invalidation descriptor only after all context-cache invalidation descriptors ahead of it have completed"
    - "hardware completes a PASID-based IOTLB invalidation descriptor only after all context-cache and PASID-cache descriptors ahead of it have completed"
    - "software must always request IOTLB invalidation before the corresponding Device-TLB invalidation"
    - "the Invalidation Wait descriptor synchronises software with hardware, and its Fence (FN) flag makes hardware execute following descriptors only after the wait completes"
  required_citation: "VT-d 5.20 §6.5.2"
  notes: "Chapter 10 sections 10.6.3 and 10.6.4."

- id: hvci-uses-ept
  chapter: 15-security.md
  type: mechanism
  question: "How does Windows memory integrity actually stop a kernel exploit from running shellcode, given that the attacker already has kernel write?"
  must_include:
    - "memory integrity (HVCI) runs kernel-mode code integrity inside the VBS isolated environment rather than in the kernel it is policing"
    - "the enforced invariant is W^X for kernel memory: a page is made executable only after passing code-integrity checks in the secure environment, and executable pages are never writable"
    - "the executable permission lives in the EPT entry the hypervisor controls, not in the VTL0 page tables the compromised kernel controls"
    - "so a VTL0 kernel cannot grant itself execute rights, and the write-shellcode-then-jump step fails"
    - "mode-based execute control for EPT (MBEC) is what makes this affordable, by splitting EPT execute permission into supervisor-mode execute and user-mode execute"
  required_citation: "SDM 3C §31.3.2"
  notes: "Chapter 15 section 15.8. Microsoft names MBEC, AMD GMET and ARM TTS2UXN as the features that reduce HVCI's cost."

- id: virtual-interrupt-delivery
  chapter: 07-apic-virtualization.md
  type: mechanism
  question: "With virtual-interrupt delivery on, what does the processor do when it decides to deliver a virtual interrupt?"
  must_include:
    - "a virtual interrupt is recognized only when the priority class of RVI (bits 7:4) is strictly greater than the priority class of VPPR (bits 7:4)"
    - "recognition is not delivery: the guest must also be able to accept an interrupt - RFLAGS.IF = 1 and no blocking by STI or MOV SS"
    - "on delivery the processor takes Vector = RVI, sets VISR[Vector]"
    - "sets SVI to the vector"
    - "sets VPPR to the vector's priority class (Vector AND F0H)"
    - "clears VIRR[Vector] and recomputes RVI from the remaining VIRR bits"
    - "then delivers the interrupt through the guest IDT with no VM exit"
  required_citation: "SDM 3C Ch.32"
  notes: "Chapter 07 sections 7.6.3 and 7.6.4. A VMM injects under VID by setting the VIRR bit and raising RVI, not by using the VM-entry interruption-information field."

- id: ept-violation-vs-misconfiguration
  chapter: 06-address-translation.md
  type: mechanism
  question: "What is the difference between an EPT violation and an EPT misconfiguration, and how should my handlers differ?"
  must_include:
    - "an EPT violation (exit reason 48) means the entries are well formed but deny the access, or an entry is not present"
    - "an EPT misconfiguration (exit reason 49) means an entry contains an unsupported value"
    - "a violation is a policy decision the VMM programmed on purpose; a misconfiguration is a bug in the table the VMM built"
    - "an exit qualification is defined for an EPT violation but not for an EPT misconfiguration, so a misconfiguration gives no architectural hint beyond the guest-physical address"
    - "both record the offending address in the guest-physical address VM-exit information field"
    - "resuming after a misconfiguration without changing the entry re-raises the same exit, so the only correct handling is to correct or tear down the mapping"
    - "the most common real cause of an unexpected misconfiguration is a non-atomic update to a live EPT entry that momentarily leaves an illegal permission combination"
    - "for a violation, qualification bits 3, 4 and 5 all clear means the guest-physical address is not mapped at all by EPT, while some of them set means a permission failure on a mapped page"
    - "neither exit advances RIP: the saved guest RIP points at the faulting instruction and the instruction must be re-executed, not skipped"
  required_citation: "SDM 3C Ch.31"
  notes: "Chapter 06 sections 6.4.2 and 6.4.4; the qualification bits are chapter 05 section 5.4.6 and the RIP rule is 5.3.1. Advancing RIP on a fault-like exit is named as a common hypervisor bug."

- id: default1-controls-and-true-msrs
  chapter: 02-vmcs.md
  type: mechanism
  question: "Why can I not just zero-initialise the VM-execution control fields, and what are the TRUE_ capability MSRs for?"
  must_include:
    - "for the pin-based, primary processor-based, VM-exit and VM-entry controls, bits 31:0 of the capability MSR report the allowed-0 settings and bits 63:32 the allowed-1 settings"
    - "a control may be 0 only if its allowed-0 bit is 0, and may be 1 only if its allowed-1 bit is 1"
    - "a control whose allowed-0 bit is 1 is a default-1 control and must be set to 1 on that processor"
    - "IA32_VMX_BASIC bit 55 indicates the TRUE_ capability MSRs at 48DH to 490H"
    - "the TRUE_ MSRs report the same allowed-1 settings but may report allowed-0 of 0 for controls that are default-1 in the original MSRs"
    - "so software that wants to clear a default-1 control such as CR3-load exiting or CR3-store exiting must consult the TRUE_ MSR"
    - "the correct derivation is to OR in the allowed-0 half and AND with the allowed-1 half"
    - "a control field that violates either constraint makes VM entry fail with VM-instruction error 7"
  must_not_include:
    - "the first VMX processors only supported the 1-setting of bits 1, 2 and 4"
  required_citation: "SDM 3D App.A"
  notes: "Chapter 02 section 2.8.4 explicitly rewrites the old 'first processors' framing: bits 1, 2 and 4 are the default-1 class of the pin-based controls, not a property of early silicon."

- id: idt-vectoring-reinjection
  chapter: 05-vm-exit.md
  type: mechanism
  question: "My guest hangs after a fault that happened while it was taking another fault. What is the architectural mechanism I am missing?"
  must_include:
    - "the IDT-vectoring information field records an event whose delivery through the guest IDT was interrupted by the VM exit"
    - "its bit 31 is the valid bit and it is the VMM's signal that an event was lost and must be re-delivered"
    - "its layout is bits 7:0 vector, bits 10:8 interruption type, bit 11 error-code valid, bit 31 valid"
    - "the standard response is to copy the IDT-vectoring information and error code into the VM-entry interruption-information and VM-entry exception error-code fields for the next VM entry"
    - "for a software interrupt, privileged software exception or software exception the VM-exit instruction length must be carried over to the VM-entry instruction length"
    - "the field must be read on every VM exit unconditionally, because a task switch, an EPT violation or an exception can all interrupt event delivery"
  required_citation: "SDM 3C §27.9.3"
  notes: "Chapter 05 section 5.6 and the dispatch recipe in 5.12 step 3."

- id: vpid-ept-tagging
  chapter: 06-address-translation.md
  type: mechanism
  question: "With VPID and EPT both on, which invalidation instruction do I need after which change? I keep getting stale translations."
  must_include:
    - "the processor caches three kinds of mapping: linear mappings tagged with the current VPID and PCID, guest-physical mappings tagged with the current EP4TA, and combined mappings tagged with all three"
    - "guest-physical mappings carry no VPID tag, so no INVVPID type can invalidate them - removing one requires INVEPT"
    - "INVEPT does invalidate combined mappings, because those carry an EP4TA as well"
    - "with enable VPID set, VM entry and VM exit no longer invalidate cached linear or combined mappings, so every invalidation is the VMM's responsibility"
    - "making an EPT entry more permissive needs no invalidation because the processor never caches a negative result; making it more restrictive, or repointing it, does"
    - "a vCPU migrating to another logical processor needs INVVPID single-context for that VPID; recycling a VPID needs the same before first use"
    - "VPID 0000H is reserved for VMX root operation, and VM entry fails if enable VPID is 1 with a VPID of 0000H"
  required_citation: "SDM 3C Ch.31"
  notes: "Chapter 06 section 6.6, including the invalidation-site table."

- id: ve-conversion-and-busy-field
  chapter: 06-address-translation.md
  type: mechanism
  question: "Under what exact conditions does an EPT violation become a #VE instead of a VM exit, and why can a #VE handler not fault recursively?"
  must_include:
    - "the virtualization exception is vector 20 and is delivered in VMX non-root operation in place of an EPT-violation VM exit"
    - "all three conditions must hold: the EPT-violation #VE VM-execution control is 1, bit 63 (suppress-#VE) of the EPT leaf entry is 0, and the 32-bit field at offset 4 of the virtualization-exception information area is 0"
    - "the processor sets the field at offset 4 to FFFFFFFFH when it delivers a #VE and never delivers another while it is non-zero, so guest software must clear it"
    - "that makes #VE non-reentrant by construction: a handler that faults again before clearing offset 4 gets a VM exit rather than a nested #VE"
    - "because bit 63 suppresses rather than enables, turning the control on converts every convertible EPT violation at once unless the VMM has already set bit 63 where it wants to keep the exit"
  required_citation: "SDM 3C §27.6.19"
  notes: "Chapter 06 section 6.11. The information area is at encoding 202AH and holds exit reason at 0, busy at 4, qualification at 8, GLA at 16, GPA at 24, EPTP index at 32."

- id: ipi-virtualization-pid-table
  chapter: 07-apic-virtualization.md
  type: mechanism
  question: "What does IPI virtualization add on top of posted interrupts, and which IPIs still exit?"
  must_include:
    - "IPI virtualization is enabled by a tertiary processor-based VM-execution control"
    - "the processor emulates the ICR writes that would send an IPI by posting directly into the target vCPU's posted-interrupt descriptor"
    - "it finds that descriptor through a PID-pointer table indexed by the target vCPU's APIC ID, bounded by the last PID-pointer index field"
    - "a PID-pointer table entry carries a valid bit in bit 0 alongside the 64-byte-aligned descriptor address"
    - "only physical-addressing, flat-mode, unicast IPIs are covered"
    - "logical addressing, broadcast and shorthand forms, an index beyond the last PID-pointer index, and an invalid table entry all fall back to a trap-like APIC-write VM exit, basic exit reason 56"
    - "once posted, delivery follows the ordinary posted-interrupt path: set PIR, set ON if it was clear and SN is 0, send NV to NDST"
  required_citation: "SDM 3C Ch.32"
  notes: "Chapter 07 section 7.9. IPI virtualization is a server-platform feature - see 18-comparison section 18.11."

- id: interrupt-index-and-source-validation
  chapter: 11-vtd-interrupt-remapping.md
  type: mechanism
  question: "How does VT-d turn an incoming MSI into an IRTE lookup, and how does it decide the device was allowed to raise that interrupt?"
  must_include:
    - "a DWORD write with FEEh in address bits 31:20 is decoded as an interrupt request"
    - "address bit 4 is the Interrupt Format field: 0 is compatibility format, 1 is remappable format"
    - "in remappable format address bits 19:5 carry Handle[14:0], bit 3 is SHV, and bit 2 carries Handle[15]"
    - "interrupt_index = address.handle when SHV is 0, and address.handle + data.subhandle when SHV is 1"
    - "an index at or beyond the configured table size is an error (fault reason 21h)"
    - "SVT selects the validation: 01b compares the requester-id against SID under the mask chosen by SQ, 10b treats the upper 8 bits of SID as a Startbus# and the lower 8 as an Endbus# and checks the bus number lies in that range"
    - "a source-id verification failure blocks the request and is reported as fault reason 26h"
  required_citation: "VT-d 5.20 §5.1.3"
  notes: "Chapter 11 sections 11.2.2, 11.3 and 11.4.1. Handle[15] sitting at address bit 2 is the pitfall in 11.12."

- id: ooh-reported-results
  chapter: 14-nested-virtualization.md
  type: mechanism
  question: "What speedups does the Out of Hypervisor work report for EPML?"
  must_include:
    - "the two figure sets come from different versions of the same work and must not be merged"
    - "the SC'22 result is that EPML speeds up CRIU checkpointing by 13x and Boehm garbage collection by 6x relative to SPML, /proc and userfaultfd, with 16x less overhead on the monitored application"
    - "the arXiv preprint abstract instead reports a checkpoint-time reduction of about 14% at an overhead of about 0.5%"
    - "this knowledge base does not choose between them; always say which version a number comes from"
  must_not_include:
    - "EPML speeds up checkpointing by about 14x"
  required_citation: "errata.md O6"
  notes: "Chapter 14 section 14.13 reproduces both quotations. Averaging or blending the two figure sets is the failure being tested."

- id: hyperv-owns-vmx-root
  chapter: 17-windows-platform.md
  type: mechanism
  question: "On a Windows PC, who owns VMX root operation, and what does that mean for a third-party VMM?"
  must_include:
    - "VMX root operation has exactly one owner per logical processor: the software that executed VMXON, and the architecture provides no way to share it"
    - "when the Windows hypervisor is running it is that owner - it launches before the Windows kernel, and the Windows installation becomes the root partition, a guest running in VTL0"
    - "enabling VBS, WSL2, Windows Sandbox, Docker Desktop's Hyper-V backend or the Hyper-V role all start the hypervisor, even when no virtual machine is ever created"
    - "a third-party VMM must then use the Windows Hypervisor Platform, run as a nested guest, or require the hypervisor be turned off"
    - "turning the hypervisor off disables every Hyper-V-backed Windows feature at once, including the security ones"
  required_citation: "SDM 3C Ch.26"
  notes: "Chapter 17 sections 17.1 and 17.3.6. This is the fact SKILL.md says resolves most Windows VT questions."

- id: enlightened-vmcs
  chapter: 17-windows-platform.md
  type: mechanism
  question: "What is Hyper-V's enlightened VMCS and how does it relate to VMCS shadowing?"
  must_include:
    - "a virtual processor enables a VP assist page by writing its guest-physical address to the synthetic MSR at 0x40000073"
    - "the VP assist page carries the enlightened VMCS"
    - "a guest hypervisor reads and writes that in-memory structure, which Hyper-V consumes at VM entry, instead of executing VMREAD and VMWRITE"
    - "it addresses the same cost that VMCS shadowing addresses in hardware - the inner hypervisor's field-access traps - but by a software contract instead of a hardware control"
  required_citation: "SDM 3C §27.6.15"
  notes: "Chapter 17 section 17.2.3, cross-referenced from chapter 14 section 14.12.2."

- id: vtl-isolation-slat
  chapter: 15-security.md
  type: mechanism
  question: "What is a Virtual Trust Level and what hardware actually enforces the boundary between VTL0 and VTL1?"
  must_include:
    - "normal Windows, kernel mode included, runs in VTL0; the secure kernel and Isolated User Mode run in VTL1"
    - "VTLs are hierarchical, so VTL1 is strictly more privileged than VTL0"
    - "the boundary is enforced by memory access permissions the hypervisor assigns with second-level address translation - EPT on Intel parts"
    - "software inside the partition, including the VTL0 kernel, cannot change those permissions"
    - "Microsoft implements up to 16 trust levels architecturally but ships two, VTL0 and VTL1"
    - "Isolated User Mode trustlets run at VTL1 in user mode and marshal system calls to the VTL0 kernel"
  required_citation: "SDM 3C §31.3"
  notes: "Chapter 15 section 15.7; chapter 17 section 17.2.7 owns the partition-side mechanics. This is the same EPT permission machinery as 06, applied to trust levels rather than VMs."

- id: tdx-tlb-tracking
  chapter: 13-tdx.md
  type: mechanism
  question: "Before the host can remove a private page from a TD, it has to prove no CPU still caches a translation for it. How does that protocol work?"
  must_include:
    - "step 1 is TDH.MEM.RANGE.BLOCK on each GPA range, which blocks creation of new translations but leaves existing cached ones valid"
    - "step 2 is TDH.MEM.TRACK, which advances the TD's epoch counter"
    - "step 3 is an IPI to each remote logical processor running one of the TD's VCPUs"
    - "step 4 is that each such LP TD-exits on receipt of the IPI"
    - "step 5 is that the VMM treats the exit as spurious and re-enters the TD, and that entry flushes any stale entries"
    - "a range counts as tracked once every one of the TD's VCPUs has been inactive at least once after TDH.MEM.TRACK"
    - "if the VMM knows the active-VCPU count is zero after TDH.MEM.TRACK it may skip the IPIs"
    - "cached address translation here includes TLB entries, cached paging-structure entries and GPAs the module has translated into VMX control-structure fields"
  required_citation: "TDX-BASE §9.7"
  notes: "Chapter 13 section 13.8.5. BEPOCH in the leaf PAMT entry records TDCS.TD_EPOCH at the moment of blocking."

- id: l1tf-mitigation-chain
  chapter: 15-security.md
  type: mechanism
  question: "What does a hypervisor actually have to do about L1TF, and why is turning off hyperthreading not the whole answer?"
  must_include:
    - "the mechanism is a terminal fault: when the paging-structure entry has Present clear or reserved bits set, its address bits may still be used speculatively to read the L1 data cache, and Intel states terminal faults can occur while reading EPT entries too"
    - "the OS-side mitigation is PTE inversion - non-present entries are made to refer to a physical address above the highest cacheable memory"
    - "the VMM-side mitigation is writing bit 0 of IA32_FLUSH_CMD (MSR 10BH) to flush the L1 data cache, repeated on every guest entry"
    - "IA32_ARCH_CAPABILITIES bit 3 (SKIP_L1DFL_VMENTRY) says the hypervisor need not flush the L1D on VM entry"
    - "flushing does not address a sibling thread executing concurrently, because hyperthreads share the L1D"
    - "Intel's own wording is that disabling hyperthreading does not in itself provide mitigation for L1TF"
    - "where IA32_ARCH_CAPABILITIES bit 17 (FB_CLEAR) is reported, L1D_FLUSH does not overwrite fill buffers, so an L1TF flush is not an MDS mitigation and the VERW sequence is still required"
  required_citation: "SDM 4 §2.1"
  notes: "Chapter 15 sections 15.4.2 and 15.5.1. L1TF is CVE-2018-3615/3620/3646, INTEL-SA-00161."

- id: flexpriority-generation
  chapter: 07-apic-virtualization.md
  type: mechanism
  question: "Which processor generation introduced FlexPriority?"
  must_include:
    - "the generation is disputed and this knowledge base does not pick a side"
    - "one line of evidence places TPR-shadow-capable silicon in 2006 to 2007 Core 2 (Merom/Penryn) parts, on the strength of a Core 2 Duo T7700 reporting the flexpriority and tpr_shadow CPU flags"
    - "the other places the introduction of Intel VT FlexPriority at the Xeon 7400 series in 2008, which is the Intel-side and review-press framing"
    - "both datings must be given; the likeliest reconciliation (hardware 2006, brand 2008) is not stated by any source"
    - "FlexPriority is a marketing name for TPR-shadow-based TPR virtualization, not a separate architectural facility - the SDM only describes the use TPR shadow VM-execution control"
  required_citation: "errata.md O1"
  notes: "Chapter 07 sections 7.2 and 7.12 flag it as unresolved. Asserting either date alone is the failure being tested."

- id: vmfunc-generation
  chapter: 06-address-translation.md
  type: mechanism
  question: "Which generation did VMFUNC and EPTP switching arrive in - Haswell or Skylake?"
  must_include:
    - "the two attributions measure different things and both must be given"
    - "the instruction entered the SDM/ISA documentation in the Haswell/Silvermont era"
    - "hardware availability is commonly dated to Skylake in engineering practice, with Xen and KVM support landing 2015 to 2016"
    - "do not assert a single generation"
  required_citation: "errata.md E06"
  notes: "Chapter 06 section 6.13 defers the question to errata rather than asserting it; chapter 02 owns the VM-function control fields."

- id: tdx-aes-key-strength
  chapter: 13-tdx.md
  type: mechanism
  question: "Is TDX memory encryption AES-128-XTS or AES-256?"
  must_include:
    - "it depends on the generation and the sources do not state it the same way"
    - "the TDX base architecture describes the MKTME/TME-MK engine as providing memory encryption using AES-128-XTS"
    - "Intel's TDX feature-readiness material gives the AES key strength as 128 bit on 4th and 5th Gen Xeon and 256 bit on Xeon 6, both E-core and P-core"
    - "so an unqualified statement that TDX uses AES-128-XTS is wrong as a general claim; state the generation with the number"
  required_citation: "TDX-ISA Ch.2"
  notes: "Chapter 13 section 13.4.5 and errata O3. The ISA specification defines the TME-MK interoperation but does not fix a data-encryption key length."

