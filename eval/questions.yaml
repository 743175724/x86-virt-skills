# intel-vt golden evaluation set
#
# 80 questions.  Scoring protocol: eval/RUNNER.md
#   lookup     24  (02 05 06 07 08 10 11 12 13)
#   mechanism  24
#   diagnosis  20
#   trap       12  (one per confirmed erratum - all must be present)
#
# Every must_include item is verifiable against the chapter named in `chapter`.
# Every required_citation is an anchor that appears verbatim in that chapter.
# Ten questions have an honest answer of "the knowledge base does not have this"
# or "the sources disagree"; their expected hedge is in must_include.

# ===========================================================================
# LOOKUP  (24)
# ===========================================================================

- id: vmcs-encoding-derive
  chapter: 02-vmcs.md
  type: lookup
  question: "I have a VMCS field encoding of 0x201A in a trace and no table to hand. What field is it, and how do I decode an arbitrary encoding without a table?"
  must_include:
    - "0x201A is the EPT pointer (EPTP)"
    - "bit 0 is the access type, 0 = full and 1 = high"
    - "bits 9:1 are the field index, so 0x201A has index 13"
    - "bits 11:10 are the field type, 0 = control"
    - "bits 14:13 are the field width, 1 = 64-bit"
    - "encoding = (width << 13) | (type << 10) | (index << 1) | access"
  required_citation: "SDM 3D App.B"
  notes: "The chapter gives this exact worked example plus the derivation rule; a correct answer should reproduce both."

