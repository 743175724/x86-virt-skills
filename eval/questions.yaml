- id: trap-ept-qual-bit6
  chapter: 05-vm-exit.md
  type: trap
  question: "And bit 6 of the same qualification - is that the AND of the XD bits across the EPT paging structures?"
  must_include:
    - "no - bit 6 is the logical-AND of the user-mode execute permission (bit 10) of the EPT paging-structure entries used in the translation"
    - "it is defined only when the mode-based execute control for EPT VM-execution control is 1, and is otherwise undefined"
    - "it has nothing to do with the execute-disable bit of the guest's own paging structures"
    - "bit 5 is the companion: the AND of bit 2, which is execute when MBEC is off and supervisor-mode execute when MBEC is on"
  must_not_include:
    - "bit 6 is the logical-AND of the XD bits"
    - "bit 6 is derived from the execute-disable bit"
  required_citation: "SDM 3C §27.9.1"
  notes: "errata E17. Chapter 05 sections 5.4.6 and 5.13; chapter 06 sections 6.3.1 and 6.4.3."

